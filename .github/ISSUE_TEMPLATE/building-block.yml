name: A building block
description: Something an app module needs from TurnOver's core, which the module can't do alone
labels: [building block]
body:
  - type: markdown
    attributes:
      value: |
        A building block is something every app could use: a hook app modules don't have yet, a kind of control TurnOver doesn't read, or a change to how focus, speech or keys work. MODULE-GUIDE.md and docs/BUILDING-BLOCKS.md explain more.
        You don't need to know how to build it. Say what the app needs, and what you tried. Thank you.
  - type: input
    id: app
    attributes:
      label: Which app?
      description: The app's name, and its version if you know it.
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: What does the module need?
      description: In a sentence or two. For example, to know when a list's selection changes even though the list never has the focus.
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What did you try in the module, and why wasn't it enough?
      description: What the app reports (Accessibility Inspector helps), and what happened.
    validations:
      required: true
  - type: textarea
    id: unlocks
    attributes:
      label: What would it let the module do?
      description: What a user would hear or be able to do once it exists.
  - type: input
    id: others
    attributes:
      label: Other apps that might need it
      description: Optional. Apps you know of with the same problem.
