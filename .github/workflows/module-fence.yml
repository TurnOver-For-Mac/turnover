name: Module fence

# Outside contributors (and their AIs) build app modules; TurnOver's core changes only through a maintainer
# (6 Nov 2026). This check fails when a pull request from outside the project touches anything but app-module work,
# so it can't merge until a maintainer has looked. Tools/check-module-fence.py says what is inside the fence.
#
# pull_request_target runs this file and the check as they are on main, never the pull request's own copies, so a
# pull request can't change the fence to pass it. The pull request's code is only compared, never run, here.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  fence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Fetch the pull request's commits (not run)
        run: git fetch --no-tags origin "pull/${{ github.event.pull_request.number }}/head:pr-head"
      - name: Check the fence
        env:
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          cp Tools/check-module-fence.py "$RUNNER_TEMP/fence.py"
          git -c advice.detachedHead=false checkout -q pr-head
          case "$ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR) python3 -I "$RUNNER_TEMP/fence.py" "$BASE" ;;
            *) python3 -I "$RUNNER_TEMP/fence.py" "$BASE" --outside ;;
          esac
